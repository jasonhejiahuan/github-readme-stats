name = "github-readme-stats"

main = "workers/index.js"

compatibility_date = "2026-05-21"

compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
